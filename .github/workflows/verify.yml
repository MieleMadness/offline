name: Offline 0.2.0 · Verify

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Fast checks run on PRs; Windows compilation is explicitly opt-in.
concurrency:
  group: offline-0.2.0-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  frontend:
    name: 0.2.0 · Fast frontend verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend packages
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npm run check
      - name: Frontend unit tests
        run: npm run test
      - name: Production frontend bundle
        run: npm run build

  windows:
    # Dispatch manually for release, or add [windows] to a PR title.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.title, '[windows]')
    name: 0.2.0 · Windows compile (on demand)
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend packages
        run: npm install --no-audit --no-fund
      - name: Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build Windows desktop executable
        run: npx tauri build --no-bundle
