name: Offline 0.18.1 · Verify

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Fast checks run on PRs. Use [rust] for targeted Windows Rust tests;
# [windows] or workflow_dispatch builds the full desktop executable.
concurrency:
  group: offline-0.18.1-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  frontend:
    name: 0.18.1 · Fast frontend verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend packages
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npm run check
      - name: Frontend unit tests
        run: npm run test
      - name: Synthetic ZIP and Apache model compliance checks (Python, no user data)
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Production frontend bundle
        run: npm run build

  windows:
    # Full compile for [windows]; Rust-only importer acceptance for [rust].
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.title, '[windows]') || contains(github.event.pull_request.title, '[rust]')
    name: 0.18.1 · Windows native checks (on demand)
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend packages
        run: npm install --no-audit --no-fund
      - name: Generate fictional ZIPs for native importer acceptance
        run: python scripts/generate_facebook_fixtures.py --output fixtures/generated --large-count 5125
      - name: Rust unit tests and native fictional-export acceptance
        env:
          OFFLINE_ACCEPTANCE_FIXTURES: ${{ github.workspace }}/fixtures/generated
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build Windows desktop executable
        if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.title, '[windows]')
        run: npx tauri build --no-bundle
      - name: Verify unsigned executable and calculate SHA-256
        if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.title, '[windows]')
        shell: pwsh
        run: |
          $exe = "src-tauri/target/release/offline.exe"
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "Expected Windows executable was not produced at $exe"
          }
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "src-tauri/target/release/SHA256SUMS.txt" -Value "$hash  offline.exe" -Encoding utf8
      - name: Upload unsigned Windows test executable
        if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.title, '[windows]')
        uses: actions/upload-artifact@v4
        with:
          name: Offline-v0.18.1-Windows-unsigned-preview
          path: |
            src-tauri/target/release/offline.exe
            src-tauri/target/release/SHA256SUMS.txt
            third_party/licenses/Apache-2.0.txt
            THIRD_PARTY_NOTICES.md
            models/embeddinggemma-2.manifest.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
