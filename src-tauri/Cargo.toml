[package]
name = "offline"
version = "0.1.0"
description = "Private desktop explorer for personal data exports"
authors = ["Offline contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "offline_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
